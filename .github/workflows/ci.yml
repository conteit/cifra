name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `verify` includes `test:stories`, which runs every Storybook story as a
      # browser-mode Vitest test. That needs the same Chromium the e2e job uses.
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'pull_request'
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 14
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Yes, this job runs the Firebase Auth emulator (#44) — and it needs no step
    # of its own to do it. `playwright.config.ts` declares the emulator as a
    # `webServer`, so `npm run test:e2e` starts it here exactly as it does on a
    # laptop; a CI-only setup step would be a second way to start it and a
    # second thing to drift. `firebase-tools` is a devDependency installed by
    # `npm ci`, and the Auth emulator is a plain Node process — no Java, no
    # emulator downloads, no `firebase login`, no project.
    #
    # What that leaves untested here: the *production* Firebase path. Nothing in
    # CI signs in against a real project, so a broken `VITE_FIREBASE_*` value in
    # Vercel, a missing authorized domain, or a Google-provider misconfiguration
    # would still reach production unseen. Deliberate: the credentials for that
    # do not belong in CI, and `readFirebaseConfig` plus the session store's
    # `unavailable` branch are covered as units instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright-version
        run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
