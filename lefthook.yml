commit-msg:
  commands:
    commitlint:
      # {1} must stay quoted: git passes an absolute path for worktrees, and the
      # repo checkout can live under a directory whose name contains a space.
      run: npx --no-install commitlint --edit "{1}"

pre-commit:
  commands:
    format:
      run: npm run format:check
    lint:
      run: npm run lint
    assist:
      run: npm run assist:check

pre-push:
  commands:
    no-direct-push-to-main:
      only:
        - ref: main
      run: |
        echo "Refusing to push directly to main. Open a pull request."
        echo "If you really mean it: git push --no-verify"
        exit 1
